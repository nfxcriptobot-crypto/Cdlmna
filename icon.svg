<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.3" />

  <!-- Tactical Grid Marks -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6, 12" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8, 8" stroke-opacity="0.5" />

  <!-- Reticle Crosshairs -->
  <line x1="256" y1="46" x2="256" y2="110" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="402" x2="256" y2="466" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="46" y1="256" x2="110" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="402" y1="256" x2="466" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

  <!-- Corner Brackets -->
  <path d="M 120 160 L 120 120 L 160 120" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
  <path d="M 392 160 L 392 120 L 352 120" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
  <path d="M 120 352 L 120 392 L 160 392" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
  <path d="M 392 352 L 392 392 L 352 392" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />

  <!-- Central Tactical Insignia (Tactical Skull Shield) -->
  <g filter="url(#glow)">
    <!-- Outer Shield Crest -->
    <path d="M 256 120 L 340 160 L 330 290 Q 256 380 256 400 Q 256 380 182 290 L 172 160 Z" fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="8" />

    <!-- Inner Crest Inset -->
    <path d="M 256 142 L 322 174 L 314 278 Q 256 352 256 368 Q 256 352 198 278 L 190 174 Z" fill="#1e293b" fill-opacity="0.8" stroke="#0ea5e9" stroke-width="2" />

    <!-- Helmet / Visor Shape -->
    <path d="M 216 230 L 296 230 L 290 260 L 256 276 L 222 260 Z" fill="url(#amberGrad)" />
    
    <!-- Crosshairs in Center -->
    <circle cx="256" cy="245" r="5" fill="#ffffff" />
    
    <!-- Top Chevrons -->
    <path d="M 236 170 L 256 190 L 276 170" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 236 190 L 256 210 L 276 190" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Game Monogram / Text -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="4">SHADOW STRIKE</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="6">SURVIVAL</text>
</svg>
